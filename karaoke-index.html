<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마이크 - 내 노래방</title>
<link rel="manifest" href="data:application/json,{}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&display=swap');
:root{
  --bg:#0d0d14;--card:#17171f;--card2:#1e1e2a;
  --accent:#ff4d6d;--accent2:#ff8fa3;
  --gold:#ffd166;--silver:#b0b0c8;--bronze:#cd8050;
  --green:#06d6a0;--blue:#48cae4;
  --text:#f0f0f8;--muted:#6060a0;--border:#252535;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;display:flex;flex-direction:column;}

/* 네비 */
.nav{background:var(--card);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,4px);}
.nav-btn{flex:1;padding:10px 4px 6px;border:none;background:transparent;color:var(--muted);font-size:10px;font-family:'Noto Sans KR',sans-serif;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-user-select:none;user-select:none;}
.nav-btn .ni{font-size:20px;line-height:1;}
.nav-btn.active{color:var(--accent);}

/* 페이지 */
.page{display:none;flex:1;flex-direction:column;overflow:hidden;}
.page.active{display:flex;}

/* 헤더 */
.hdr{background:var(--card);padding:14px 14px 8px;flex-shrink:0;border-bottom:1px solid var(--border);}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--accent);display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.hdr-title .badge{font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px;letter-spacing:0;}

/* 검색 */
.search-wrap{position:relative;margin-bottom:6px;}
.search-inp{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:12px;padding:8px 34px 8px 34px;color:var(--text);font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.search-inp:focus{border-color:var(--accent);}
.search-inp::placeholder{color:var(--muted);}
.s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);}
.s-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);cursor:pointer;display:none;}

/* 서브탭 */
.sub-tabs{display:flex;gap:4px;margin-bottom:5px;}
.sub-tab{flex:1;padding:6px 3px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:center;-webkit-user-select:none;user-select:none;}
.sub-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* 정렬 */
.sort-row{display:flex;gap:4px;}
.sort-btn{padding:4px 8px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none;}
.sort-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(255,143,163,.1);}

/* 스크롤 영역 */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 10px 10px;}

/* 곡 카드 */
.song-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 11px;margin-bottom:6px;position:relative;overflow:hidden;}
.song-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);}
.song-card.done::before{background:var(--green);}
.card-top{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;}
.status-tog{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.status-tog.pr{background:rgba(255,77,109,.12);color:var(--accent);}
.status-tog.dn{background:rgba(6,214,160,.12);color:var(--green);}
.song-ttl{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.song-art{font-size:11px;color:var(--muted);margin-top:1px;}
.num-row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
.num-chip{display:flex;align-items:center;gap:2px;background:var(--card2);border-radius:5px;padding:2px 6px;font-size:11px;font-weight:700;}
.num-chip .lbl{font-size:8px;color:var(--muted);font-weight:400;margin-right:1px;}
.num-chip.tj{border-left:2px solid #ff6b6b;}
.num-chip.ky{border-left:2px solid #4dabf7;}
.num-chip.na{opacity:.35;}
.tag-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:3px;}
.key-tag{font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(72,202,228,.1);color:var(--blue);border:1px solid rgba(72,202,228,.2);}
.st-tag{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;}
.st-tag.pr{background:rgba(255,77,109,.1);color:var(--accent);border:1px solid rgba(255,77,109,.2);}
.st-tag.dn{background:rgba(6,214,160,.1);color:var(--green);border:1px solid rgba(6,214,160,.2);}
.memo-txt{font-size:10px;color:var(--muted);background:var(--card2);border-radius:5px;padding:3px 6px;line-height:1.4;margin-bottom:2px;}
.card-actions{display:flex;gap:5px;margin-top:5px;}
.act-btn{flex:1;padding:5px 3px;border-radius:7px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:10px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:center;-webkit-user-select:none;user-select:none;}
.act-btn.fav-on{border-color:var(--gold);color:var(--gold);background:rgba(255,209,102,.08);}

/* 탑100 카드 */
.top-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.top-rank{font-family:'Bebas Neue',sans-serif;font-size:20px;min-width:28px;text-align:center;line-height:1;}
.top-rank.r1{color:var(--gold);}
.top-rank.r2{color:var(--silver);}
.top-rank.r3{color:var(--bronze);}
.top-rank.rn{color:var(--muted);font-size:15px;}
.top-info{flex:1;min-width:0;}
.top-ttl{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-art{font-size:10px;color:var(--muted);margin-top:1px;}
.top-nums{display:flex;gap:4px;margin-top:3px;}
.top-chip{font-size:10px;padding:2px 5px;border-radius:4px;background:var(--card2);font-weight:700;}
.top-chip.tj{border-left:2px solid #ff6b6b;}
.top-chip.ky{border-left:2px solid #4dabf7;}
.top-chip .tl{font-size:8px;color:var(--muted);font-weight:400;}
.top-btns{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.top-fav,.top-del{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;}
.top-fav.on{border-color:var(--gold);color:var(--gold);background:rgba(255,209,102,.1);}
.top-del{border-color:rgba(255,77,109,.3);background:rgba(255,77,109,.07);color:var(--accent);}

/* 즐겨찾기 카드 */
.fav-card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;padding:10px 11px;margin-bottom:6px;}
.fav-head{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;}
.fav-badge{font-size:9px;padding:2px 5px;border-radius:4px;font-weight:700;flex-shrink:0;margin-top:2px;}
.fav-badge.tj{background:rgba(255,107,107,.15);color:#ff6b6b;}
.fav-badge.ky{background:rgba(77,171,247,.15);color:#4dabf7;}
.fav-badge.my{background:rgba(6,214,160,.15);color:var(--green);}
.fav-badge.custom{background:rgba(199,125,255,.15);color:#c77dff;}
.fav-actions{display:flex;gap:5px;margin-top:5px;}
.fav-act{flex:1;padding:5px 3px;border-radius:7px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:10px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:center;-webkit-user-select:none;user-select:none;}
.fav-act.edit{border-color:var(--blue);color:var(--blue);background:rgba(72,202,228,.08);}
.fav-act.remove{border-color:rgba(255,77,109,.3);color:var(--accent);background:rgba(255,77,109,.07);}

/* FAB */
.fab-area{flex-shrink:0;padding:6px 10px 4px;display:flex;gap:6px;}
.fab{flex:1;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-user-select:none;user-select:none;}
.fab.json{background:var(--card2);border:1.5px solid var(--border);color:var(--muted);flex:0 0 auto;padding:11px 12px;font-size:12px;}

/* 빈 상태 */
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .ei{font-size:38px;margin-bottom:8px;}
.empty p{font-size:12px;line-height:1.6;}

/* 모달 */
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:400;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .25s,visibility .25s;}
.overlay.open{visibility:visible;opacity:1;pointer-events:auto;}
.modal{background:var(--card);border-radius:18px 18px 0 0;padding:16px 14px 30px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);border-top:1px solid var(--border);}
.overlay.open .modal{transform:translateY(0);}
.modal-handle{width:32px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 12px;}
.modal-ttl{font-size:16px;font-weight:700;margin-bottom:12px;}

/* 폼 */
.fg{margin-bottom:11px;}
.fl{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;display:block;letter-spacing:.5px;}
.fi{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.fi:focus{border-color:var(--accent);}
.fi::placeholder{color:var(--muted);}
textarea.fi{resize:none;min-height:55px;line-height:1.4;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.key-opts{display:flex;gap:4px;margin-bottom:6px;}
.key-opt{flex:1;padding:6px 2px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:center;-webkit-user-select:none;user-select:none;}
.key-opt.active{border-color:var(--blue);color:var(--blue);background:rgba(72,202,228,.1);}
.key-adj{display:flex;align-items:center;gap:8px;}
.adj-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;}
.adj-val{font-size:18px;font-weight:700;min-width:30px;text-align:center;color:var(--blue);}
.st-opts{display:flex;gap:6px;}
.st-opt{flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:center;color:var(--muted);-webkit-user-select:none;user-select:none;}
.st-opt.ap{border-color:var(--accent);color:var(--accent);background:rgba(255,77,109,.1);}
.st-opt.ad{border-color:var(--green);color:var(--green);background:rgba(6,214,160,.1);}
.rk-wrap{position:relative;}
.rk-pre{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:14px;}
.rk-wrap .fi{padding-left:26px;}
.m-actions{display:flex;gap:7px;margin-top:14px;}
.btn-del{padding:10px 12px;border-radius:10px;border:1.5px solid rgba(255,77,109,.3);background:rgba(255,77,109,.07);color:var(--accent);font-size:12px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.btn-cancel{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.btn-save{flex:2;padding:10px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}

/* JSON 모달 */
.json-format{background:var(--card2);border-radius:8px;padding:10px;font-size:10px;color:var(--muted);line-height:1.5;border:1px solid var(--border);margin-bottom:6px;white-space:pre-wrap;word-break:break-all;}
.json-result{padding:6px 10px;border-radius:7px;font-size:11px;margin-top:5px;}
.json-result.err{background:rgba(255,77,109,.1);color:var(--accent);border:1px solid rgba(255,77,109,.2);}
.jil{display:flex;flex-direction:column;gap:5px;max-height:40vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:6px 0;}
.jil-item{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:9px;padding:8px 10px;border:1px solid var(--border);}
.jil-check{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:var(--accent);}
.jil-info{flex:1;min-width:0;}
.jil-title{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;}
.jil-dup{font-size:9px;color:var(--gold);background:rgba(255,209,102,.1);border-radius:3px;padding:1px 4px;font-weight:600;}
.jil-artist{font-size:10px;color:var(--muted);margin-top:1px;}
.jil-nums{font-size:10px;color:var(--muted);margin-top:1px;}
.sel-header{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.sel-label{font-size:11px;color:var(--muted);}
.sel-count{font-size:11px;font-weight:700;color:var(--accent);margin-left:auto;}
.json-btns{display:flex;gap:7px;margin-top:12px;}
.jbtn{flex:1;padding:10px;border-radius:10px;font-size:12px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:center;-webkit-user-select:none;user-select:none;}
.jbtn.back,.jbtn.cancel{background:transparent;border:1.5px solid var(--border);color:var(--muted);}
.jbtn.confirm,.jbtn.parse{background:var(--accent);border:none;color:#fff;flex:2;}

/* 토스트 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--card2);color:var(--text);font-size:12px;font-weight:600;padding:8px 14px;border-radius:18px;border:1px solid var(--border);z-index:600;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- 탭1: 내 목록 -->
<div class="page active" id="page-my">
  <div class="hdr">
    <div class="hdr-title">🎤 마이크 <span class="badge" id="myCount">0곡</span></div>
    <div class="search-wrap">
      <span class="s-icon">🔍</span>
      <input type="text" class="search-inp" id="mySearch" placeholder="제목, 가수 검색...">
      <span class="s-clear" id="mySearchClear">✕</span>
    </div>
    <div class="sub-tabs" id="myFilters">
      <button class="sub-tab active" data-f="all">전체</button>
      <button class="sub-tab" data-f="practicing">🎤 연습중</button>
      <button class="sub-tab" data-f="done">✨ 완료</button>
    </div>
    <div class="sort-row" id="mySorts">
      <button class="sort-btn active" data-s="rank">🏆 순위순</button>
      <button class="sort-btn" data-s="recent">🕐 최신순</button>
      <button class="sort-btn" data-s="title">가나다</button>
    </div>
  </div>
  <div class="scroll" id="myList"></div>
  <div class="fab-area">
    <button class="fab json" id="jsonImportBtn">📥 JSON</button>
    <button class="fab" id="addBtn">＋ 새 곡 추가</button>
  </div>
</div>

<!-- 탭2: 탑100 -->
<div class="page" id="page-top">
  <div class="hdr">
    <div class="hdr-title">🏆 탑 100 <span class="badge" id="topBadge">TJ</span></div>
    <div class="search-wrap">
      <span class="s-icon">🔍</span>
      <input type="text" class="search-inp" id="topSearch" placeholder="제목, 가수 검색...">
      <span class="s-clear" id="topSearchClear">✕</span>
    </div>
    <div class="sub-tabs" id="topBrands">
      <button class="sub-tab active" data-brand="tj">TJ 미디어</button>
      <button class="sub-tab" data-brand="ky">금영</button>
      <button class="sub-tab" data-brand="custom">📥 추가곡</button>
    </div>
  </div>
  <div class="scroll" id="topList"></div>
</div>

<!-- 탭3: 즐겨찾기 -->
<div class="page" id="page-fav">
  <div class="hdr">
    <div class="hdr-title">⭐ 즐겨찾기 <span class="badge" id="favCount">0</span></div>
    <div class="search-wrap">
      <span class="s-icon">🔍</span>
      <input type="text" class="search-inp" id="favSearch" placeholder="제목, 가수 검색...">
      <span class="s-clear" id="favSearchClear">✕</span>
    </div>
    <div class="sort-row" id="favSorts">
      <button class="sort-btn active" data-fs="recent">🕐 추가순</button>
      <button class="sort-btn" data-fs="title">가나다</button>
    </div>
  </div>
  <div class="scroll" id="favList"></div>
</div>

<!-- 하단 네비 -->
<nav class="nav" id="mainNav">
  <button class="nav-btn active" data-page="my"><span class="ni">🎵</span>내 목록</button>
  <button class="nav-btn" data-page="top"><span class="ni">🏆</span>탑 100</button>
  <button class="nav-btn" data-page="fav"><span class="ni">⭐</span>즐겨찾기</button>
</nav>

<!-- 내 목록 추가/수정 모달 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="modalTtl">새 곡 추가</div>
    <div class="fg"><label class="fl">노래 제목 *</label><input type="text" class="fi" id="fTitle" placeholder="예: 응급실"></div>
    <div class="fg"><label class="fl">가수명 *</label><input type="text" class="fi" id="fArtist" placeholder="예: izi"></div>
    <div class="frow fg">
      <div><label class="fl">TJ 번호</label><input type="number" class="fi" id="fTj" placeholder="14512"></div>
      <div><label class="fl">금영 번호</label><input type="number" class="fi" id="fKy" placeholder="9489"></div>
    </div>
    <div class="fg">
      <label class="fl">키 설정</label>
      <div class="key-opts" id="keyOpts">
        <button class="key-opt active" data-k="male">👨 남성키</button>
        <button class="key-opt" data-k="female">👩 여성키</button>
        <button class="key-opt" data-k="original">원키</button>
      </div>
      <div class="key-adj">
        <button class="adj-btn" id="keyMinus">−</button>
        <div class="adj-val" id="keyVal">0</div>
        <button class="adj-btn" id="keyPlus">＋</button>
        <span style="font-size:10px;color:var(--muted)">반음</span>
      </div>
    </div>
    <div class="fg">
      <label class="fl">상태</label>
      <div class="st-opts">
        <button class="st-opt ap" id="stPr">🎤 연습중</button>
        <button class="st-opt" id="stDn">✨ 완료</button>
      </div>
    </div>

// 로컬스토리지 안전 접근
function ls(k,v){
  try{
    if(v===undefined) return localStorage.getItem(k);
    if(v===null) return localStorage.removeItem(k);
    localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));
  }catch(e){return null;}
}
function lsGet(k,def){try{var r=ls(k);return r?JSON.parse(r):def;}catch(e){return def;}}

function loadAll(){
  mySongs=lsGet(MY_KEY,[]);
  customSongs=lsGet(CUSTOM_KEY,[]);
  var fArr=lsGet(FAV_KEY,[]);
  favs={};fArr.forEach(function(k){favs[k]=1;});
  favEdits=lsGet(FAVEDIT_KEY,{});
  if(!mySongs.length){
    mySongs=[
      {id:1,title:'응급실',artist:'izi',tj:'14512',ky:'9489',keyType:'male',keyAdj:-2,status:'done',rank:1,memo:'도입부 박자 주의. 고음 지르기 최고.',createdAt:Date.now()-5000},

      {id:3,title:'사랑했잖아',artist:'임창정',tj:'3512',ky:'4521',keyType:'male',keyAdj:-1,status:'done',rank:3,memo:'회식용 필수.',createdAt:Date.now()-3000}
    ];
    saveMy();
  }
}
function saveMy(){ls(MY_KEY,mySongs);}
function saveCustom(){ls(CUSTOM_KEY,customSongs);}
function saveFavs(){ls(FAV_KEY,Object.keys(favs));}
function saveFE(){ls(FAVEDIT_KEY,favEdits);}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2100);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function keyLabel(kt,ka){
  var b=kt==='male'?'👨남':kt==='female'?'👩여':'원키';
  if(!ka) return b;
  return b+'('+(ka>0?'+':'')+ka+')';
}

// ── 내 목록 ──
function getMyList(){
  var list=mySongs.slice();
  if(myFilter==='practicing') list=list.filter(function(s){return s.status==='practicing';});
  if(myFilter==='done') list=list.filter(function(s){return s.status==='done';});
  if(myQ){var q=myQ.toLowerCase();list=list.filter(function(s){return s.title.toLowerCase().indexOf(q)>=0||s.artist.toLowerCase().indexOf(q)>=0;});}
  if(mySort==='rank') list.sort(function(a,b){return(a.rank||9999)-(b.rank||9999)||b.createdAt-a.createdAt;});
  else if(mySort==='recent') list.sort(function(a,b){return b.createdAt-a.createdAt;});
  else list.sort(function(a,b){return a.title.localeCompare(b.title,'ko');});
  return list;
}
function renderMy(){
  var list=getMyList();
  document.getElementById('myCount').textContent=mySongs.length+'곡';
  var el=document.getElementById('myList');
  if(!list.length){el.innerHTML='<div class="empty"><div class="ei">🎵</div><p>'+(myQ?'검색 결과 없음':'곡을 추가해보세요')+'</p></div>';return;}
  var h='';

    var s=list[i],dn=s.status==='done',fk='my:'+s.id,isFav=!!favs[fk];
    h+='<div class="song-card'+(dn?' done':'')+'">'
      +'<div class="card-top">'
      +'<button class="status-tog '+(dn?'dn':'pr')+'" data-act="togglest" data-id="'+s.id+'">'+(dn?'✨':'🎤')+'</button>'

      +'<div class="song-art">'+esc(s.artist)+(s.rank?' · <span style="color:var(--gold)">🏆'+s.rank+'위</span>':'')+'</div></div></div>'

      +'<div class="num-chip ky '+(s.ky?'':'na')+'"><span class="lbl">금영</span>'+(s.ky||'—')+'</div></div>'

// ── 즐겨찾기 ──
function getFavData(k,orig){return favEdits[k]?Object.assign({},orig,favEdits[k]):Object.assign({},orig);}
function getFavList(){
  var list=[];
  var keys=Object.keys(favs);
  for(var i=0;i<keys.length;i++){
    var k=keys[i],p=k.split(':'),src=p[0],id=p.slice(1).join(':');
    var orig=null,badge=src,addedAt=0;
    if(src==='my'){var s=mySongs.filter(function(x){return x.id===parseInt(id);})[0];if(s){orig=Object.assign({},s);addedAt=s.createdAt;}}
    else if(src==='tj'){var s=TJ100.filter(function(x){return x.rank===parseInt(id);})[0];if(s)orig=Object.assign({keyType:'original',keyAdj:0,status:'practicing'},s);}
    else if(src==='ky'){var s=KY100.filter(function(x){return x.rank===parseInt(id);})[0];if(s)orig=Object.assign({keyType:'original',keyAdj:0,status:'practicing'},s);}
    else if(src==='custom'){var s=customSongs.filter(function(x){return x.id===parseInt(id);})[0];if(s)orig=Object.assign({keyType:'original',keyAdj:0,status:'practicing'},s);addedAt=s?s.addedAt||0:0;}
    if(orig){var data=getFavData(k,orig);data._fk=k;data._badge=badge;data._addedAt=addedAt;list.push(data);}
  }
  if(favQ){var q=favQ.toLowerCase();list=list.filter(function(s){return s.title.toLowerCase().indexOf(q)>=0||s.artist.toLowerCase().indexOf(q)>=0;});}
  if(favSort==='title') list.sort(function(a,b){return a.title.localeCompare(b.title,'ko');});
  else list.sort(function(a,b){return b._addedAt-a._addedAt;});
  return list;
}
function renderFav(){
  var list=getFavList();
  document.getElementById('favCount').textContent=list.length;
  var el=document.getElementById('favList');
  var bl={my:'내목록',tj:'TJ',ky:'금영',custom:'추가곡'};
  if(!list.length){el.innerHTML='<div class="empty"><div class="ei">⭐</div><p>즐겨찾기한 곡이 없습니다</p></div>';return;}
  var h='';
  for(var i=0;i<list.length;i++){
    var s=list[i],dn=s.status==='done',hasEdit=!!favEdits[s._fk];
    h+='<div class="fav-card"><div class="fav-head">'
      +'<span class="fav-badge '+s._badge+'">'+(bl[s._badge]||s._badge)+'</span>'
      +'<div style="flex:1;min-width:0"><div class="song-ttl">'+esc(s.title)+'</div>'
      +'<div class="song-art">'+esc(s.artist)+(s.rank?' · 🏆'+s.rank+'위':'')+'</div></div></div>'
      +'<div class="num-row">'
      +'<div class="num-chip tj '+(s.tj?'':'na')+'"><span class="lbl">TJ</span>'+(s.tj||'—')+'</div>'
      +'<div class="num-chip ky '+(s.ky?'':'na')+'"><span class="lbl">금영</span>'+(s.ky||'—')+'</div></div>'
      +'<div class="tag-row"><span class="key-tag">'+keyLabel(s.keyType,s.keyAdj)+'</span>'
      +'<span class="st-tag '+(dn?'dn':'pr')+'">'+(dn?'✨완료':'🎤연습중')+'</span>'
      +(hasEdit?'<span class="key-tag" style="background:rgba(255,209,102,.1);color:var(--gold);border-color:rgba(255,209,102,.2)">수정됨</span>':'')+'</div>'
      +(s.memo?'<div class="memo-txt">'+esc(s.memo)+'</div>':'')
      +'<div class="fav-actions">'
      +'<button class="fav-act edit" data-act="favedit" data-fk="'+s._fk+'">✏️ 수정</button>'
      +(hasEdit?'<button class="fav-act" data-act="favreset" data-fk="'+s._fk+'" style="border-color:rgba(255,209,102,.3);color:var(--gold)">↩초기화</button>':'')
      +'<button class="fav-act remove" data-act="favremove" data-fk="'+s._fk+'">해제</button>'
      +'</div></div>';
  }
  el.innerHTML=h;
}

function saveSong(){
  var title=document.getElementById('fTitle').value.trim(),artist=document.getElementById('fArtist').value.trim();
  if(!title||!artist){toast('제목과 가수명을 입력해주세요.');return;}
  var d={title:title,artist:artist,tj:document.getElementById('fTj').value.trim(),ky:document.getElementById('fKy').value.trim(),keyType:keyType,keyAdj:keyAdj,status:statusVal,rank:parseInt(document.getElementById('fRank').value)||null,memo:document.getElementById('fMemo').value.trim()};
  if(editId){for(var i=0;i<mySongs.length;i++){if(mySongs[i].id===editId){Object.assign(mySongs[i],d);break;}}toast('✅ 수정 완료!');}
  else{var nid=mySongs.length?Math.max.apply(null,mySongs.map(function(s){return s.id;}))+1:1;d.id=nid;d.createdAt=Date.now();mySongs.push(d);toast('🎵 새 곡 추가!');}
  saveMy();renderMy();closeMod();
}
function deleteSong(){
  if(!editId||!confirm('삭제할까요?'))return;
  delete favs['my:'+editId];delete favEdits['my:'+editId];
  mySongs=mySongs.filter(function(s){return s.id!==editId;});
  saveMy();saveFavs();saveFE();renderMy();renderFav();closeMod();toast('🗑 삭제됨');
}

function openJson(){
  document.getElementById('jsonInput').value='';
  document.getElementById('jsonResult').style.display='none';
  document.getElementById('jsonStep1').style.display='block';
  document.getElementById('jsonStep2').style.display='none';
  document.getElementById('jsonOverlay').classList.add('open');
}
function closeJson(){document.getElementById('jsonOverlay').classList.remove('open');}
function parseJson(){
  var raw=document.getElementById('jsonInput').value.trim(),res=document.getElementById('jsonResult');
  if(!raw){res.textContent='JSON을 입력해주세요.';res.className='json-result err';res.style.display='block';return;}
  var arr;try{arr=JSON.parse(raw);}catch(e){res.textContent='파싱 오류: '+e.message;res.className='json-result err';res.style.display='block';return;}
  if(!Array.isArray(arr)){res.textContent='배열 [ {...} ] 형식이어야 합니다.';res.className='json-result err';res.style.display='block';return;}
  var valid=arr.filter(function(s){return s&&typeof s.title==='string'&&s.title.trim()&&typeof s.artist==='string'&&s.artist.trim();});
  if(!valid.length){res.textContent='title, artist 필드가 필요합니다.';res.className='json-result err';res.style.display='block';return;}
  parsedJsonSongs=valid.map(function(s,i){return{_tid:i,title:s.title.trim(),artist:s.artist.trim(),tj:String(s.tj||'').trim(),ky:String(s.ky||'').trim(),rank:s.rank||null,memo:String(s.memo||'').trim()};});
  document.getElementById('jsonStep1').style.display='none';
  document.getElementById('jsonStep2').style.display='block';
  document.getElementById('jsonStep2Ttl').textContent='가져올 곡 선택 ('+parsedJsonSongs.length+'곡)';
  var exist={};customSongs.forEach(function(s){exist[s.title+'|'+s.artist]=1;});
  var el=document.getElementById('jsonImportList');
  var h='';
  for(var i=0;i<parsedJsonSongs.length;i++){
    var s=parsedJsonSongs[i],dup=exist[s.title+'|'+s.artist];
    h+='<div class="jil-item"><input type="checkbox" class="jil-check" data-tid="'+s._tid+'"'+(dup?'':' checked')+'>'
      +'<div class="jil-info"><div class="jil-title">'+esc(s.title)+(dup?'<span class="jil-dup">이미있음</span>':'')+'</div>'
      +'<div class="jil-artist">'+esc(s.artist)+'</div>'
      +'<div class="jil-nums">TJ '+(s.tj||'—')+' · 금영 '+(s.ky||'—')+'</div></div></div>';
  }
  el.innerHTML=h;
  updateSel();
}
function updateSel(){
  var n=document.querySelectorAll('#jsonImportList .jil-check:checked').length;
  document.getElementById('selCount').textContent=n+'곡';
}
function confirmJson(){
  var cbs=document.querySelectorAll('#jsonImportList .jil-check:checked');
  if(!cbs.length){toast('선택된 곡이 없습니다.');return;}
  var now=Date.now(),maxId=customSongs.length?Math.max.apply(null,customSongs.map(function(s){return s.id||0;})):0;
  var added=0;
  for(var i=0;i<cbs.length;i++){
    var tid=parseInt(cbs[i].getAttribute('data-tid'));
    var s=parsedJsonSongs.filter(function(x){return x._tid===tid;})[0];
    if(s){customSongs.push({id:maxId+i+1,title:s.title,artist:s.artist,tj:s.tj,ky:s.ky,rank:s.rank,memo:s.memo,addedAt:now});added++;}
  }
  saveCustom();closeJson();
  topBrand='custom';
  var bs=document.querySelectorAll('#topBrands .sub-tab');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('active',bs[i].getAttribute('data-brand')==='custom');
  renderTop();toast('✅ '+added+'곡 추가!');
}

// ── 이벤트 위임 ──
document.addEventListener('click',function(e){
  var t=e.target,act=t.getAttribute('data-act');
  if(!act) t=t.parentElement;
  if(t) act=t.getAttribute('data-act');
  if(!act) return;

  if(act==='togglest'){
    var id=parseInt(t.getAttribute('data-id'));
    var s=mySongs.filter(function(x){return x.id===id;})[0];
    if(s){s.status=s.status==='done'?'practicing':'done';saveMy();renderMy();toast(s.status==='done'?'✨완료!':'🎤연습중!');}
  }
  else if(act==='myfav'){
    var id=parseInt(t.getAttribute('data-id')),k='my:'+id;
    if(favs[k]){delete favs[k];toast('즐겨찾기 해제');}else{favs[k]=1;toast('⭐즐겨찾기 추가!');}
    saveFavs();renderMy();renderFav();
  }
  else if(act==='edit'){openEdit(parseInt(t.getAttribute('data-id')));}
  else if(act==='topfav'){
    var k=t.getAttribute('data-src')+':'+t.getAttribute('data-sid');
    if(favs[k]){delete favs[k];toast('해제');}else{favs[k]=1;toast('⭐추가!');}
    saveFavs();renderTop();renderFav();
  }
  else if(act==='topdel'){
    var sid=parseInt(t.getAttribute('data-sid'));
    if(!confirm('삭제?'))return;
    delete favs['custom:'+sid];delete favEdits['custom:'+sid];
    customSongs=customSongs.filter(function(s){return s.id!==sid;});
    saveCustom();saveFavs();saveFE();renderTop();renderFav();toast('🗑삭제됨');
  }
  else if(act==='favedit'){openFavEdit(t.getAttribute('data-fk'));}
  else if(act==='favreset'){
    delete favEdits[t.getAttribute('data-fk')];saveFE();renderFav();toast('↩초기화됨');
  }
  else if(act==='favremove'){
    var k=t.getAttribute('data-fk');delete favs[k];delete favEdits[k];
    saveFavs();saveFE();renderFav();renderMy();if(document.getElementById('page-top').classList.contains('active'))renderTop();toast('해제');
  }
});

// 검색
function bindSearch(inpId,clearId,fn){
  document.getElementById(inpId).addEventListener('input',function(){fn(this.value);document.getElementById(clearId).style.display=this.value?'block':'none';});
  document.getElementById(clearId).addEventListener('click',function(){document.getElementById(inpId).value='';fn('');this.style.display='none';});
}
bindSearch('mySearch','mySearchClear',function(v){myQ=v;renderMy();});
