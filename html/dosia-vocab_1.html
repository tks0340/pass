<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도시락 VOC樂</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fdf6fb;--bg2:#f9eef6;--white:#ffffff;
  --surface:#ffffff;--surface2:#fdf0f8;--border:#f0d9ee;
  --text:#2d1f2e;--text2:#5a3d5c;--muted:#b08ab5;
  --accent:#c084b8;--accent2:#d4a0cb;--accent-light:#fae8f7;
  --green:#22c55e;--green-light:#dcfce7;
  --red:#ef4444;--red-light:#fee2e2;
  --yellow:#f59e0b;--yellow-light:#fef3c7;
  --purple:#9b7fbd;--purple-light:#f0e9fa;
  --pink:#e879a8;--pink-light:#fde7f3;
  --blue:#8fb4e8;--blue-light:#e8f0fb;
  --orange:#e8956a;--orange-light:#fdeee6;
  --radius:18px;--radius-sm:10px;
  --shadow:0 2px 16px rgba(192,132,184,0.12);
  --shadow-md:0 4px 32px rgba(192,132,184,0.16);
  --shadow-lg:0 8px 48px rgba(192,132,184,0.20);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--surface2);
  color: var(--text);
  font-family: 'DM Sans', 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background decoration */
body::before {
  content: '';
  position: fixed;
  top: -120px; right: -120px;
  width: 420px; height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(92,110,248,0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -100px; left: -100px;
  width: 350px; height: 350px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(236,72,153,0.09) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
.header {
  background: var(--white);
  border-bottom: 1.5px solid var(--border);
  padding: 0 28px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 12px rgba(92,110,248,0.07);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  box-shadow: 0 3px 10px rgba(92,110,248,0.3);
}
.logo-text {
  font-size: 1.05rem;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.3px;
}
.logo-text span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.pill {
  padding: 5px 13px;
  border-radius: 50px;
  font-size: 0.76rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 5px;
  border: 1.5px solid transparent;
}
.pill-blue { background: var(--blue-light); color: var(--blue); border-color: #bfdbfe; }
.pill-green { background: var(--green-light); color: var(--green); border-color: #bbf7d0; }
.pill-yellow { background: var(--yellow-light); color: var(--yellow); border-color: #fde68a; }
.pill-purple { background: var(--purple-light); color: var(--purple); border-color: #ddd6fe; }
.pill-orange { background: var(--orange-light); color: var(--orange); border-color: #fed7aa; }

.tts-btn {
  padding: 5px 13px;
  border-radius: 50px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.tts-btn.on { background: var(--blue-light); border-color: #bfdbfe; color: var(--blue); }

/* MAIN */
.main { max-width: 1100px; margin: 0 auto; padding: 24px 20px; position: relative; z-index: 1; }

/* TABS */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 22px;
  background: var(--white);
  padding: 5px;
  border-radius: 50px;
  width: 100%;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
}
.tabs::-webkit-scrollbar{display:none;}
.tab {
  padding: 8px 4px;
  border-radius: 50px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-weight: 700;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all .2s;
  flex: 1;
  text-align: center;
  white-space: nowrap;
}
.tab.active {
  background: var(--accent);
  color: white;
  box-shadow: 0 3px 10px rgba(92,110,248,0.3);
}
.tab:hover:not(.active) { color: var(--text); background: var(--surface2); }
.section { display: none; }
.section.active { display: block; }

/* BUTTONS */
.btn {
  padding: 11px 22px;
  border-radius: 50px;
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 14px rgba(92,110,248,0.35); }
.btn-primary:hover { background: var(--accent2); box-shadow: 0 6px 20px rgba(92,110,248,0.4); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--white); color: var(--text2); border: 1.5px solid var(--border); box-shadow: var(--shadow); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-green { background: var(--green); color: white; box-shadow: 0 4px 14px rgba(34,197,94,0.3); }
.btn-green:hover { background: #16a34a; }
.btn-red { background: var(--red); color: white; box-shadow: 0 4px 14px rgba(239,68,68,0.3); }
.btn-red:hover { background: #dc2626; }
.btn-purple { background: var(--purple); color: white; box-shadow: 0 4px 14px rgba(139,92,246,0.3); }
.btn-purple:hover { background: #7c3aed; }
.btn-blue { background: var(--blue); color: white; box-shadow: 0 4px 14px rgba(59,130,246,0.3); }
.btn-blue:hover { background: #2563eb; }
.btn-orange { background: var(--orange); color: white; box-shadow: 0 4px 14px rgba(249,115,22,0.3); }

/* CARDS */
.card {
  background: var(--white);
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
}

/* HOME DASHBOARD */
.review-banner {
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  box-shadow: 0 6px 24px rgba(92,110,248,0.3);
}
.review-banner-text { color: white; }
.review-banner-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 3px; }
.review-banner-sub { font-size: 0.78rem; opacity: 0.85; }
.review-banner .btn { background: white; color: var(--accent); font-weight: 800; }

.no-review-banner {
  background: var(--green-light);
  border: 1.5px solid #bbf7d0;
  border-radius: var(--radius);
  padding: 14px 20px;
  margin-bottom: 16px;
  color: #15803d;
  font-weight: 700;
  font-size: 0.9rem;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.dash-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 18px 16px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform .2s;
}
.dash-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.dash-card-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  margin: 0 auto 10px;
}
.dash-val { font-size: 1.9rem; font-weight: 900; line-height: 1; margin-bottom: 4px; }
.dash-lbl { font-size: 0.7rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }

.level-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 18px 20px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.level-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.level-name-big { font-size: 1rem; font-weight: 900; }
.level-hint { font-size: 0.75rem; color: var(--muted); }
.level-bar { height: 8px; background: var(--surface2); border-radius: 50px; overflow: hidden; border: 1px solid var(--border); }
.level-fill { height: 100%; border-radius: 50px; transition: width .7s cubic-bezier(.4,0,.2,1); }

.quick-btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* UPLOAD */
.api-box {
  background: var(--white);
  border: 1.5px solid #bfdbfe;
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.api-box-title { font-weight: 800; font-size: 0.88rem; margin-bottom: 4px; color: var(--blue); }
.api-box-desc { font-size: 0.76rem; color: var(--muted); margin-bottom: 10px; }
.api-row { display: flex; gap: 8px; flex-wrap: wrap; }
.api-input { flex: 1; min-width: 180px; padding: 9px 13px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-family: monospace; font-size: 0.8rem; outline: none; transition: border-color .2s; }
.api-input:focus { border-color: var(--accent); }
#apiKeyStatus { font-size: 0.73rem; margin-top: 6px; }

.upload-area {
  background: var(--white);
  border: 2px dashed #c7d2fe;
  border-radius: var(--radius);
  padding: 52px 36px;
  text-align: center;
  cursor: pointer;
  transition: all .3s;
}
.upload-area:hover, .upload-area.drag-over {
  border-color: var(--accent);
  background: var(--accent-light);
  transform: scale(1.003);
}
.upload-icon { font-size: 3rem; margin-bottom: 12px; }
.upload-area h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
.upload-area p { color: var(--muted); font-size: 0.86rem; }
#fileInput { display: none; }
.preview-container { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.preview-box { background: var(--white); border-radius: var(--radius); overflow: hidden; border: 1.5px solid var(--border); box-shadow: var(--shadow); }
.preview-box img { width: 100%; max-height: 240px; object-fit: contain; background: var(--surface2); }
.preview-label { padding: 8px 12px; font-weight: 700; font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.action-row { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }

.danger-zone {
  background: var(--red-light);
  border: 1.5px solid #fecaca;
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.danger-zone-text { }
.danger-zone-title { font-weight: 800; font-size: 0.88rem; color: var(--red); }
.danger-zone-sub { font-size: 0.74rem; color: #b91c1c; margin-top: 2px; }

.import-box {
  background: var(--white);
  border-radius: var(--radius);
  padding: 18px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  margin-top: 16px;
}
.import-box h3 { font-weight: 800; font-size: 0.95rem; margin-bottom: 4px; }
.import-box p { font-size: 0.76rem; color: var(--muted); margin-bottom: 10px; }
.import-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
.import-tab { padding: 5px 13px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted); font-family: inherit; font-weight: 700; font-size: 0.76rem; cursor: pointer; transition: all .15s; }
.import-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
.import-textarea { width: 100%; height: 88px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-family: monospace; font-size: 0.74rem; padding: 10px; outline: none; resize: vertical; line-height: 1.5; transition: border-color .2s; }
.import-textarea:focus { border-color: var(--accent); }
.import-hint { font-size: 0.7rem; color: var(--muted); margin-bottom: 7px; }
.import-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* WORD LIST */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.section-title { font-size: 1.1rem; font-weight: 900; }
.count-badge { background: var(--accent-light); color: var(--accent); padding: 3px 11px; border-radius: 50px; font-size: 0.74rem; font-weight: 800; border: 1.5px solid #c7d2fe; }
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.word-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.word-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #c7d2fe; }
.word-card.memorized { border-color: #bbf7d0; background: linear-gradient(135deg, #f0fdf4, white); }
.word-card.memorized::after { content: '✓'; position: absolute; top: 12px; right: 14px; color: var(--green); font-weight: 900; font-size: 1rem; }
.word-card.due-today { border-color: #fed7aa; background: linear-gradient(135deg, #fff7ed, white); }
.word-card.due-today::before { content: '📅'; position: absolute; top: 12px; right: 14px; font-size: 0.9rem; }
.word-en { font-size: 1.2rem; font-weight: 900; color: var(--accent); margin-bottom: 3px; letter-spacing: -0.3px; }
.word-type-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 50px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 7px;
  background: var(--accent-light);
  color: var(--accent);
  border: 1px solid #c7d2fe;
}
.word-ko { font-size: 0.92rem; font-weight: 700; color: var(--text); margin-bottom: 7px; }
.word-example { font-size: 0.76rem; color: var(--text2); line-height: 1.5; font-style: italic; }
.word-example-ko { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.srs-info { font-size: 0.66rem; color: var(--muted); margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); }
.card-footer { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
.mini-btn { padding: 4px 10px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text2); font-size: 0.7rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s; }
.mini-btn:hover { background: var(--accent-light); border-color: #c7d2fe; color: var(--accent); }
.mini-btn.active { background: var(--green-light); color: var(--green); border-color: #bbf7d0; }

/* FLASHCARD */
.flashcard-area { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
.progress-bar-wrap { width: 100%; max-width: 560px; margin-bottom: 18px; }
.progress-info { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.progress-bar { height: 6px; background: var(--surface2); border-radius: 50px; overflow: hidden; border: 1px solid var(--border); }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); border-radius: 50px; transition: width .4s ease; }
.flashcard { width: 100%; max-width: 520px; min-height: 270px; perspective: 1000px; cursor: pointer; margin-bottom: 20px; }
.flashcard-inner { position: relative; width: 100%; min-height: 270px; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); border-radius: 24px; }
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px; text-align: center; }
.card-front { background: white; border: 2px solid #c7d2fe; box-shadow: 0 8px 40px rgba(92,110,248,0.15); }
.card-back { background: linear-gradient(145deg, #eef0ff, #f5f0ff); border: 2px solid #ddd6fe; box-shadow: 0 8px 40px rgba(139,92,246,0.15); transform: rotateY(180deg); }
.card-hint { color: var(--muted); font-size: 0.78rem; font-weight: 600; margin-bottom: 12px; }
.card-word { font-size: 2.6rem; font-weight: 900; color: var(--accent); letter-spacing: -1px; }
.card-type { color: var(--purple); font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; }
.card-meaning { font-size: 1.8rem; font-weight: 900; color: var(--purple); margin-bottom: 8px; }
.card-example { font-size: 0.82rem; color: var(--text2); font-style: italic; line-height: 1.6; max-width: 360px; }
.card-example-ko { font-size: 0.78rem; color: var(--muted); margin-top: 4px; font-style: normal; }
.flashcard-controls { display: flex; gap: 12px; align-items: center; }

.srs-btns { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.srs-btn { padding: 8px 16px; border-radius: 50px; border: none; font-family: inherit; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all .2s; }
.srs-easy { background: var(--green-light); color: var(--green); border: 1.5px solid #bbf7d0; }
.srs-easy:hover { background: var(--green); color: white; }
.srs-normal { background: var(--yellow-light); color: var(--yellow); border: 1.5px solid #fde68a; }
.srs-normal:hover { background: var(--yellow); color: white; }
.srs-hard { background: var(--red-light); color: var(--red); border: 1.5px solid #fecaca; }
.srs-hard:hover { background: var(--red); color: white; }

/* QUIZ */
.quiz-setup { max-width: 560px; margin: 0 auto; }
.quiz-setup h2 { font-size: 1.5rem; font-weight: 900; margin-bottom: 5px; }
.quiz-setup > p { color: var(--muted); margin-bottom: 20px; font-size: 0.9rem; }
.quiz-mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.quiz-mode-card { background: var(--white); border: 2px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all .2s; text-align: center; box-shadow: var(--shadow); }
.quiz-mode-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.quiz-mode-card.selected { border-color: var(--accent); background: var(--accent-light); }
.mode-icon { font-size: 1.8rem; margin-bottom: 6px; }
.mode-name { font-weight: 800; font-size: 0.88rem; color: var(--text); }
.mode-desc { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
.quiz-dir-row { display: flex; gap: 8px; margin-bottom: 14px; }
.dir-btn { flex: 1; padding: 10px; border-radius: 12px; border: 2px solid var(--border); background: var(--white); color: var(--muted); font-family: inherit; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all .2s; text-align: center; box-shadow: var(--shadow); }
.dir-btn.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

.quiz-game { max-width: 600px; margin: 0 auto; }
.quiz-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.quiz-score-row { display: flex; gap: 8px; flex-wrap: wrap; }
.q-badge { padding: 5px 12px; border-radius: 50px; font-weight: 700; font-size: 0.78rem; display: flex; align-items: center; gap: 4px; border: 1.5px solid; }
.q-badge.correct { background: var(--green-light); color: var(--green); border-color: #bbf7d0; }
.q-badge.wrong { background: var(--red-light); color: var(--red); border-color: #fecaca; }
.q-badge.combo { background: var(--yellow-light); color: var(--yellow); border-color: #fde68a; }

.quiz-qbox { background: var(--white); border-radius: var(--radius); padding: 26px; margin-bottom: 14px; border: 1.5px solid var(--border); box-shadow: var(--shadow); text-align: center; }
.quiz-qnum { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.quiz-question { font-size: 2rem; font-weight: 900; color: var(--accent); line-height: 1.2; }
.quiz-question.ko { font-size: 1.6rem; color: var(--purple); }
.quiz-question.fill { font-size: 1.3rem; color: var(--text); font-style: italic; }
.quiz-meaning-hint { font-size: 0.86rem; color: var(--green); font-weight: 700; margin-top: 6px; }
.quiz-qtype-label { font-size: 0.71rem; color: var(--muted); margin-top: 6px; }
.hint-first-letter { font-size: 0.8rem; color: var(--yellow); margin-top: 3px; font-weight: 700; }

.choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.choice-btn { background: var(--white); border: 2px solid var(--border); border-radius: 13px; padding: 13px 15px; font-family: inherit; font-weight: 700; font-size: 0.88rem; color: var(--text); cursor: pointer; transition: all .15s; text-align: left; line-height: 1.3; box-shadow: var(--shadow); }
.choice-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); color: var(--accent); transform: translateY(-1px); }
.choice-btn.correct-ans { border-color: var(--green)!important; background: var(--green-light)!important; color: var(--green)!important; }
.choice-btn.wrong-ans { border-color: var(--red)!important; background: var(--red-light)!important; color: var(--red)!important; }
.choice-btn:disabled { cursor: default; }
.choice-num { font-size: 0.66rem; color: var(--muted); display: block; margin-bottom: 2px; }

.typing-area { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 12px; }
.typing-input { width: 100%; max-width: 360px; padding: 13px 18px; background: var(--white); border: 2px solid var(--border); border-radius: 13px; color: var(--text); font-family: inherit; font-size: 1.1rem; font-weight: 700; text-align: center; outline: none; transition: all .2s; box-shadow: var(--shadow); }
.typing-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92,110,248,0.1); }
.typing-input.correct { border-color: var(--green); background: var(--green-light); }
.typing-input.wrong { border-color: var(--red); background: var(--red-light); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.sentence-build { margin-bottom: 12px; }
.sentence-answer-area { min-height: 50px; background: var(--surface2); border: 2px dashed #c7d2fe; border-radius: 12px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; align-items: center; transition: border-color .2s; }
.sentence-answer-area.has-content { border-color: var(--accent); background: var(--accent-light); }
.word-chip { padding: 6px 13px; border-radius: 50px; font-weight: 700; font-size: 0.84rem; cursor: pointer; transition: all .15s; user-select: none; }
.word-chip.bank { background: var(--white); border: 1.5px solid var(--border); color: var(--text); box-shadow: var(--shadow); }
.word-chip.bank:hover { border-color: var(--accent); color: var(--accent); }
.word-chip.placed { background: var(--accent-light); border: 1.5px solid #c7d2fe; color: var(--accent); }
.word-chip.placed:hover { background: var(--red-light); border-color: #fecaca; color: var(--red); }
.word-bank { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }

.result-feedback { text-align: center; padding: 13px; border-radius: 13px; margin-bottom: 12px; font-weight: 700; font-size: 0.95rem; display: none; border: 1.5px solid; }
.result-feedback.correct { background: var(--green-light); color: #15803d; border-color: #bbf7d0; }
.result-feedback.wrong { background: var(--red-light); color: #b91c1c; border-color: #fecaca; }
.result-feedback .correct-word { font-size: 1.2rem; display: block; margin-top: 3px; font-weight: 900; }

.srs-after { text-align: center; padding: 8px 0 4px; }
.srs-after-title { font-size: 0.75rem; color: var(--muted); font-weight: 600; margin-bottom: 7px; }

.quiz-result { max-width: 460px; margin: 0 auto; text-align: center; padding: 32px 16px; }
.result-trophy { font-size: 4rem; margin-bottom: 10px; }
.result-title { font-size: 1.7rem; font-weight: 900; margin-bottom: 6px; }
.result-score { font-size: 3rem; font-weight: 900; color: var(--accent); margin: 12px 0; }
.result-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
.r-stat { text-align: center; }
.r-stat-val { font-size: 1.6rem; font-weight: 900; }
.r-stat-lbl { font-size: 0.7rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.result-btns { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }

/* STATS */
.stats-hero { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 11px; margin-bottom: 20px; }
.hero-card { background: var(--white); border-radius: var(--radius); padding: 16px; border: 1.5px solid var(--border); box-shadow: var(--shadow); text-align: center; transition: transform .2s; }
.hero-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.hero-val { font-size: 2rem; font-weight: 900; line-height: 1; margin-bottom: 4px; }
.hero-lbl { font-size: 0.7rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
.stats-section-title { font-size: 0.92rem; font-weight: 800; margin-bottom: 10px; margin-top: 20px; color: var(--text); display: flex; align-items: center; gap: 6px; }
.mastery-list { display: flex; flex-direction: column; gap: 6px; }
.mastery-row { background: var(--white); border-radius: 11px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--border); box-shadow: var(--shadow); transition: transform .15s; }
.mastery-row:hover { transform: translateX(2px); }
.mastery-word { font-weight: 900; font-size: 0.9rem; color: var(--accent); min-width: 95px; }
.mastery-ko { font-size: 0.76rem; color: var(--muted); flex: 1; }
.mastery-bar-wrap { width: 85px; height: 5px; background: var(--surface2); border-radius: 50px; overflow: hidden; flex-shrink: 0; border: 1px solid var(--border); }
.mastery-bar-fill { height: 100%; border-radius: 50px; transition: width .5s ease; }
.mastery-pct { font-size: 0.74rem; font-weight: 800; min-width: 32px; text-align: right; }
.mastery-count { font-size: 0.66rem; color: var(--muted); min-width: 44px; text-align: right; }
.wrong-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.wrong-card { background: var(--white); border: 1.5px solid #fecaca; border-radius: 13px; padding: 14px; position: relative; box-shadow: var(--shadow); }
.wc-en { font-size: 1.05rem; font-weight: 900; color: var(--red); margin-bottom: 3px; }
.wc-ko { font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; }
.wc-stat { font-size: 0.7rem; color: var(--muted); }
.wc-badge { position: absolute; top: 10px; right: 10px; background: var(--red-light); color: var(--red); padding: 2px 7px; border-radius: 50px; font-size: 0.65rem; font-weight: 800; border: 1px solid #fecaca; }
.mini-chart { display: flex; align-items: flex-end; gap: 4px; height: 52px; margin-top: 7px; }
.chart-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
.chart-bar { width: 100%; border-radius: 4px 4px 0 0; transition: height .4s ease; min-height: 2px; }
.chart-lbl { font-size: 0.56rem; color: var(--muted); font-weight: 600; }

/* EFFECTS */
.combo-pop { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); font-size: 2.5rem; font-weight: 900; color: var(--yellow); z-index: 50; pointer-events: none; text-shadow: 0 2px 12px rgba(245,158,11,0.5); transition: all .38s cubic-bezier(.34,1.56,.64,1); }
.combo-pop.show { transform: translate(-50%,-60%) scale(1); }
.combo-pop.hide { opacity: 0; transform: translate(-50%,-80%) scale(.8); }
@keyframes ripple { 0%{transform:scale(0);opacity:.5} 100%{transform:scale(3);opacity:0} }
.ripple { position: fixed; width: 40px; height: 40px; border-radius: 50%; pointer-events: none; z-index: 60; animation: ripple .5s ease-out forwards; }
.ripple.correct { background: rgba(34,197,94,.4); }
.ripple.wrong { background: rgba(239,68,68,.4); }

/* LOADING */
.loading-overlay { position: fixed; inset: 0; background: rgba(240,244,255,.88); backdrop-filter: blur(8px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.loading-overlay.show { display: flex; }
.spinner { width: 46px; height: 46px; border: 4px solid #c7d2fe; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 14px; }
@keyframes spin { to{transform:rotate(360deg)} }
.loading-text { font-size: 0.96rem; font-weight: 700; color: var(--accent); }
.loading-sub { color: var(--muted); margin-top: 4px; font-size: 0.8rem; }

/* EMPTY */
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideDown{from{transform:translateY(0);}to{transform:translateY(100%);opacity:0}}
.qopt-btn{padding:7px 12px;border-radius:50px;border:1.5px solid var(--border);background:var(--white);color:var(--text2);font-family:inherit;font-weight:700;font-size:.78rem;cursor:pointer;transition:all .15s;white-space:nowrap;}
.qopt-btn:hover{border-color:var(--accent);color:var(--accent);}
.qopt-btn.selected{background:var(--accent);color:white;border-color:var(--accent);}
.empty-state { text-align: center; padding: 60px 16px; }
.empty-state .emoji { font-size: 3rem; margin-bottom: 10px; }
.empty-state h3 { font-size: 1rem; font-weight: 800; margin-bottom: 6px; }
.empty-state p { color: var(--muted); font-size: 0.84rem; }

/* TOAST */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: white; padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 0.82rem; transition: transform .3s ease; z-index: 200; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
.toast.show { transform: translateX(-50%) translateY(0); }

@media(max-width:580px){
  .preview-container,.quiz-mode-grid,.choices-grid,.dashboard-grid,.stats-hero{grid-template-columns:1fr;}
  .header{padding:8px 10px 7px;}
  .header-top{gap:8px;margin-bottom:4px;}
  .header-badge{width:44px;height:44px;}
  .header-title-main{font-size:1.02rem;}
  .header-bottom{gap:4px;}
  .main{padding:12px 10px 18px;}
  .tabs{gap:4px;margin-bottom:16px;padding:4px;}
  .tab{padding:8px 10px;font-size:.74rem;flex:0 0 auto;}
  .section-header{align-items:flex-start;}
  .quick-btns .btn,.import-btns .btn,.action-row .btn,.flashcard-controls .btn{width:100%;justify-content:center;}
  .quick-btns,.import-btns,.action-row,.flashcard-controls{gap:8px;}
  .word-grid{grid-template-columns:1fr;}
  .word-card{padding:14px;}
  .card-footer{gap:8px;}
  .mini-btn{flex:1 1 calc(50% - 8px);min-width:0;padding:7px 8px;font-size:.68rem;}
  .flashcard,.flashcard-inner{min-height:230px;}
  .card-face{padding:24px 18px;}
  .card-word{font-size:1.9rem;}
  .card-meaning{font-size:1.55rem;}
  .quiz-question{font-size:1.4rem;}
  .quiz-question.ko{font-size:1.18rem;}
  .quiz-dir-row{flex-direction:column;}
  .upload-area{padding:34px 18px;}
  .preview-box img{max-height:180px;}
  .import-box{padding:14px;}
  .api-box{padding:14px;}
  .count-badge,.hpill,.xp-label{font-size:.68rem;}
}

function makeWordEntry(w){
  return {
    en:w.en,
    type:w.type,
    ko:w.ko,
    example:w.example,
    example_ko:w.example_ko,
    id:Date.now()+Math.random(),
    memorized:false,
    quizCorrect:0,
    quizWrong:0,
    nextReview:null,
    srsLevel:0,
    addedAt:new Date().toISOString()
  };
}
function normalizeBuiltinWord(w){
  if(!w||!w.en)return null;
  return {
    en:String(w.en).trim(),
    type:w.type||'etc',
    ko:w.ko||'',
    example:w.example||'',
    example_ko:w.example_ko||''
  };
}
function loadBuiltinWords(){
  var saved = localStorage.getItem(BUILTIN_WORDS_STORAGE_KEY);
  if(saved){
    try{
      var parsed = JSON.parse(saved);
      if(Array.isArray(parsed)) return parsed.map(normalizeBuiltinWord).filter(Boolean);
    }catch(e){}
  }
  return DEFAULT_BUILTIN_WORDS.map(normalizeBuiltinWord).filter(Boolean);
}
function saveBuiltinWords(){
  localStorage.setItem(BUILTIN_WORDS_STORAGE_KEY, JSON.stringify(builtinWords));
}
function syncBuiltinWords(newWords){
  if(!newWords||!newWords.length)return;
  var existing = new Set(builtinWords.map(function(w){return w.en.toLowerCase();}));
  var added = false;
  newWords.forEach(function(w){
    var item = normalizeBuiltinWord(w);
    if(!item)return;
    var key = item.en.toLowerCase();
    if(existing.has(key))return;
    builtinWords.push(item);
    existing.add(key);
    added = true;
  });
  if(added) saveBuiltinWords();
}
function addWordsToLibrary(newWords){
  words = words.concat(newWords.map(makeWordEntry));
  saveWords();
  syncBuiltinWords(newWords);
}

}

function handleFiles(files){
  uploadedImages=[];
  var c=document.getElementById('previewContainer');c.innerHTML='';c.style.display='grid';
  document.getElementById('actionRow').style.display='flex';
  Array.from(files).forEach(function(file,i){
    var r=new FileReader();

      uploadedImages.push({data:e.target.result,file:file});

      box.innerHTML='<img src="'+e.target.result+'"><div class="preview-label">📷 사진 '+(i+1)+'</div>';

}

if(dz)dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag-over');});
if(dz)dz.addEventListener('dragleave',function(){dz.classList.remove('drag-over');});

async function analyzeImages(){
  if(!uploadedImages.length)return;
  var apiKey=getApiKey();if(!apiKey){showToast('❌ API 키를 먼저 입력해줘!');return;}
  var btn=document.getElementById('analyzeBtn');btn.disabled=true;
  document.getElementById('loadingOverlay').classList.add('show');
  try{
    var imgs=uploadedImages.map(function(img){return{type:'image',source:{type:'base64',media_type:img.file.type||'image/jpeg',data:img.data.split(',')[1]}};});
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-4-5',max_tokens:4000,
        messages:[{role:'user',content:imgs.concat([{type:'text',
          text:'이미지에서 영어 단어를 모두 추출해줘. JSON 배열만 반환, 다른 텍스트 없이.\n[{"en":"단어","type":"noun/verb/adj/adv/etc","ko":"한국어뜻","example":"중학생수준영어예문","example_ko":"예문한국어번역"}]\n없으면 []. 중복제거, 영어단어만.'}])}]})
    });
    var data=await res.json();
    var text=data.content.map(function(c){return c.text||'';}).join('');
    var extracted=[];
    try{extracted=JSON.parse(text.replace(/```json|```/g,'').trim());}
    catch(e){var m=text.match(/\[[\s\S]*\]/);if(m)extracted=JSON.parse(m[0]);}
    if(!extracted.length){showToast('⚠️ 단어를 찾지 못했어!');}
    else{
      var existing=new Set(words.map(function(w){return w.en.toLowerCase();}));
      var newW=extracted.filter(function(w){return w.en&&!existing.has(w.en.toLowerCase());}).map(function(w){
        return {en:w.en,type:w.type||'etc',ko:w.ko||'',example:w.example||'',example_ko:w.example_ko||'',
          id:Date.now()+Math.random(),memorized:false,quizCorrect:0,quizWrong:0,nextReview:null,srsLevel:0,addedAt:new Date().toISOString()};
      });
      if(!newW.length)showToast('⚠️ 모두 중복이야!');
      else{addWordsToLibrary(newW);updateAll();showToast('🎉 '+newW.length+'개 추출!');clearImages();setTimeout(function(){gotoTab('list');},600);}
    }
  }catch(err){showToast('❌ 오류: '+err.message);}
  finally{btn.disabled=false;document.getElementById('loadingOverlay').classList.remove('show');}
}

  };

function importData(){
  var raw=document.getElementById('jsonInput').value.trim();
  if(!raw){showToast('⚠️ 내용을 입력해줘!');return;}
  if(importTabMode==='json') importJSON(raw);
  else if(importTabMode==='tsv') importTSV(raw);
  else if(importTabMode==='reset') resetByList(raw);
}
function importJSON(raw){
  var parsed;
  try{parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());}
  catch(e){showToast('❌ JSON 오류: '+e.message);return;}
  if(!Array.isArray(parsed)||!parsed.length){showToast('⚠️ 데이터 없음');return;}
  var existing=new Set(words.map(function(w){return w.en.toLowerCase();}));
  var newW=parsed.filter(function(w){return w.en&&!existing.has(w.en.toLowerCase());}).map(function(w){
    return {en:w.en,type:w.type||'etc',ko:w.ko||'',example:w.example||'',example_ko:w.example_ko||''};
  });
  if(!newW.length){showToast('⚠️ 모두 중복이야!');return;}
  addWordsToLibrary(newW);updateAll();
  document.getElementById('jsonInput').value='';
  showToast('📥 '+newW.length+'개 추가!');setTimeout(function(){gotoTab('list');},600);
}
function importTSV(raw){
  var lines=raw.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var newW=[];var existing=new Set(words.map(function(w){return w.en.toLowerCase();}));
  lines.forEach(function(line){
    var cols=line.split('\t');
    if(cols.length<2)return;
    var en=cols[0].trim();var ko=cols[1].trim();var example=cols[2]?cols[2].trim():''; 
    if(!en||existing.has(en.toLowerCase()))return;
    newW.push({en:en,type:'etc',ko:ko,example:example,example_ko:''});
    existing.add(en.toLowerCase());
  });
  if(!newW.length){showToast('⚠️ 추가할 단어 없음');return;}
  addWordsToLibrary(newW);updateAll();
  document.getElementById('jsonInput').value='';
  showToast('📥 '+newW.length+'개 TSV 추가!');setTimeout(function(){gotoTab('list');},600);
}
function resetByList(raw){
  var enList=raw.split('\n').map(function(l){return l.trim().toLowerCase();}).filter(Boolean);
  var count=0;
  words.forEach(function(w){
    if(enList.indexOf(w.en.toLowerCase())!==-1){
      w.memorized=false;w.quizCorrect=0;w.quizWrong=0;w.nextReview=null;w.srsLevel=0;count++;
    }
  });
  if(!count){showToast('⚠️ 해당 단어를 찾지 못했어!');return;}
  saveWords();updateAll();renderWordList();
  document.getElementById('jsonInput').value='';
  showToast('🔄 '+count+'개 단어 초기화 완료!');
}

// ── WORD LIST ──
function typeLabel(t){return {noun:'명사',verb:'동사',adj:'형용사',adv:'부사',prep:'전치사',pron:'대명사',conj:'접속사',etc:'기타'}[t]||t||'단어';}
function srsLabel(w){
  if(!w.nextReview) return '';
  var today=todayStr();
  if(w.nextReview<=today) return '📅 복습 필요';
  return '다음 복습: '+w.nextReview;
}
function renderWordList(){
  var grid=document.getElementById('wordGrid');

        '<button class="mini-btn" onclick="speakWord(\''+w.en.replace(/'/g,"\\'")+'\',true)" title="발음">🔊</button>'+'<button class="mini-btn '+(w.important?'active':'')+' " onclick="toggleImportant(\''+w.en.replace(/'/g,"\\'")+'\');renderWordList()" title="중요">'+(w.important?'⭐':'☆')+'</button>'+

}
function toggleMemorized(i){words[i].memorized=!words[i].memorized;saveWords();updateAll();renderWordList();}
function deleteWord(i){words.splice(i,1);saveWords();updateAll();renderWordList();}
function resetMemorized(){if(!confirm('암기 완료 표시를 전부 초기화할까요?'))return;words.forEach(function(w){w.memorized=false;});saveWords();updateAll();renderWordList();showToast('🔄 초기화!');}
function deleteAllWords(){if(!confirm('모든 단어를 완전히 삭제할까요?\n내장 단어도 초기화됩니다.'))return;words=[];builtinWords=[];localStorage.removeItem('doeun-words');localStorage.removeItem('doeun-words-ver');saveWords();saveBuiltinWords();updateAll();renderWordList();gotoTab('upload');showToast('전체 삭제 완료!');}

function applySRS(fIdx,days){
  var w=flashWords[fIdx];

function startQuiz(){var pool;if(quizCount==='important'){pool=words.filter(function(w){return w.important;});if(!pool.length){showToast('⭐ 중요 단어 없어!');return;}}else{pool=shuffle(words.slice());if(quizCount===50)pool=pool.slice(0,Math.max(4,Math.round(pool.length*0.5)));}quizList=shuffle(pool);quizIdx=0;quizCorrect=0;quizWrong=0;combo=0;maxCombo=0;pendingWrongWords=[];renderQuizQuestion();}

// ── 문장 완성 퀴즈 ──
function addToSentence(word,idx,btn){
  if(btn.classList.contains('placed')) return;
  currentSentenceAnswer.push({word:word,idx:idx,btn:btn});
  btn.classList.remove('bank');btn.classList.add('placed');
  var area=document.getElementById('sentenceAnswer');
  if(area.children.length===1&&area.children[0].tagName==='SPAN') area.innerHTML='';
  var chip=document.createElement('button');
  chip.className='word-chip placed';chip.textContent=word;
  (function(w,b,ch){ch.onclick=function(){
    currentSentenceAnswer=currentSentenceAnswer.filter(function(x){return x.btn!==b;});
    b.classList.remove('placed');b.classList.add('bank');
    ch.remove();
    if(!document.getElementById('sentenceAnswer').children.length)
      document.getElementById('sentenceAnswer').innerHTML='<span style="color:var(--muted);font-size:.82rem">여기에 클릭해서 단어를 배치해줘</span>';
  };})(word,btn,chip);
  area.classList.add('has-content');area.appendChild(chip);
}
function checkSentence(correctEn){
  var userSentence=currentSentenceAnswer.map(function(x){return x.word;}).join(' ');
  var w=quizList[quizIdx];
  var correct=userSentence.toLowerCase().replace(/[.,!?]/g,'')===((w.example||w.en)||'').toLowerCase().replace(/[.,!?]/g,'');
  handleResult(correct,w.en,w.ko);
}

// ── 타이핑 ──
function checkTyping(){
  var input=document.getElementById('typingInput');if(!input||quizAnswered)return;
  var dir=document.getElementById('qDir').value;
  var mode=document.getElementById('qMode').value;
  var en=document.getElementById('qEn').value;
  var ko=document.getElementById('qKo').value;
  var val=input.value.trim().toLowerCase();
  var answer=(mode==='fill'||dir==='ko2en')?en:ko;
  var isCorrect=val===answer.toLowerCase();
  quizAnswered=true;input.disabled=true;
  input.classList.add(isCorrect?'correct':'wrong');
  handleResult(isCorrect,en,ko);
}
function answerChoice(idx,isCorrect){
  if(quizAnswered)return;quizAnswered=true;
  var btns=document.querySelectorAll('.choice-btn');
  btns.forEach(function(b){b.disabled=true;});
  btns[idx].classList.add(isCorrect?'correct-ans':'wrong-ans');
  if(!isCorrect)btns.forEach(function(b){if(!b.classList.contains('wrong-ans'))b.classList.add('correct-ans');});
  handleResult(isCorrect,quizList[quizIdx].en,quizList[quizIdx].ko);
}

function handleResult(isCorrect,en,ko){
  spawnRipple(isCorrect);
  if(isCorrect){quizCorrect++;combo++;maxCombo=Math.max(maxCombo,combo);if(combo>=3)showComboPop('🔥 '+combo+'콤보!');}
  else{quizWrong++;combo=0;var wObj=quizList[quizIdx];if(!pendingWrongWords.some(function(x){return x.id===wObj.id;}))pendingWrongWords.push(wObj);}

function todayStr(){return new Date().toISOString().slice(0,10);}
function recordSession(correct,wrong){
  var sessions=JSON.parse(localStorage.getItem('doeun-sessions')||'[]');
  sessions.push({date:todayStr(),correct:correct,wrong:wrong,ts:Date.now()});
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
  sessions=sessions.filter(function(s){return new Date(s.date)>=cutoff;});
  localStorage.setItem('doeun-sessions',JSON.stringify(sessions));
}
function getStreak(){
  var sessions=JSON.parse(localStorage.getItem('doeun-sessions')||'[]');
  if(!sessions.length)return 0;
  var dates=sessions.map(function(s){return s.date;});
  dates=dates.filter(function(v,i,a){return a.indexOf(v)===i;}).sort().reverse();
  var streak=0;var check=new Date();
  for(var i=0;i<dates.length;i++){
    var ds=check.toISOString().slice(0,10);
    if(dates[i]===ds){streak++;check.setDate(check.getDate()-1);}
    else if(streak===0){var y=new Date();y.setDate(y.getDate()-1);if(dates[i]===y.toISOString().slice(0,10)){streak++;check.setDate(check.getDate()-2);}else break;}
    else break;
  }
  return streak;
}
function getLast7(sessions){
  var result=[];
  for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var ds=d.toISOString().slice(0,10);var label=i===0?'오늘':['일','월','화','수','목','금','토'][d.getDay()];var count=sessions.filter(function(s){return s.date===ds;}).length;result.push({label:label,count:count,pct:0});}
  var max=Math.max.apply(null,result.map(function(r){return r.count;}).concat([1]));
  result.forEach(function(r){r.pct=Math.round((r.count/max)*100);});return result;
}

      "<button id=\"impBtn\" style=\"padding:9px 14px;border-radius:50px;font-weight:800;font-size:.8rem;cursor:pointer;border:1.5px solid "+(isImp?"#fde68a":"#e2e8ff")+";background:"+(isImp?"#fef3c7":"#fff")+";color:"+(isImp?"#d97706":"#aaa")+"\">"+( isImp?"⭐ 중요":"☆ 중요")+"</button>"+
      "<button onclick=\"closePopup();nextQuestion()\" style=\"padding:12px 22px;border-radius:50px;border:none;background:"+nextBg+";color:white;font-weight:900;font-size:.95rem;cursor:pointer\">"+nextLabel+"</button>"+
    "</div>";
  var impBtn=pop.querySelector("#impBtn");
  impBtn.addEventListener("click",function(){
    var nowImp=toggleImportant(en);
    impBtn.textContent=nowImp?"⭐ 중요":"☆ 중요";
    impBtn.style.borderColor=nowImp?"#fde68a":"#e2e8ff";
    impBtn.style.background=nowImp?"#fef3c7":"#fff";
    impBtn.style.color=nowImp?"#d97706":"#aaa";
  });
  document.body.appendChild(pop);
}

function renderHearts(){var el=document.getElementById('heartsBar');if(!el)return;el.innerHTML=Array.from({length:maxHearts},function(_,i){return '<span class="heart'+(i>=hearts?' empty':'')+'">❤️</span>';}).join('');}
function loseHeart(){if(hearts>0){hearts--;sessionHeartLost++;renderHearts();playSound('wrong');}if(hearts===0)showToast('목숨 없음! 퀴즈 끝나면 회복');}
function addXP(n){xp+=n;stats.xp=xp;localStorage.setItem('dv-xp',xp);updateXPBar();}
function updateXPBar(){var el=document.getElementById('xpFill');var lb=document.getElementById('xpLabel');if(el)el.style.width=(xp%100)+'%';if(lb)lb.textContent=xp+'XP';}
function updateStreakBadge(){var s=document.getElementById('streakBadge');if(s)s.textContent='🔥 '+getStreak()+'일';}
function showXPPop(n){var p=document.createElement('div');p.style.cssText='position:fixed;font-size:1.1rem;font-weight:900;color:#c084b8;z-index:400;pointer-events:none;animation:xpFloat 1.1s ease forwards;top:'+(window.innerHeight*.45)+'px;left:'+(window.innerWidth*.6)+'px';p.textContent='+'+n+' XP';document.body.appendChild(p);setTimeout(function(){p.remove();},1200);}
function showCheer(msg){var el=document.getElementById('cheerPop');if(!el)return;el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1800);}
function saveStats(){localStorage.setItem('dv-stats',JSON.stringify(stats));}
function checkBadges(){var n=[];BADGES.forEach(function(b){if(earnedBadges.indexOf(b.id)===-1&&b.check(stats)){earnedBadges.push(b.id);n.push(b);}});localStorage.setItem('dv-badges',JSON.stringify(earnedBadges));if(n.length)setTimeout(function(){showBadgeUnlock(n[0]);},600);}
function showBadgeUnlock(b){var ov=document.createElement('div');ov.className='levelup-overlay';ov.innerHTML='<div class="levelup-card"><div style="font-size:3.5rem;margin-bottom:10px">'+b.icon+'</div><div style="font-size:1.4rem;font-weight:900;margin-bottom:5px">뱃지 획득!</div><div style="font-size:1.1rem;font-weight:900;color:#c084b8;margin-bottom:16px">'+b.name+'</div><button class="btn btn-primary" onclick="this.closest(\'div.levelup-overlay\').remove()" style="width:100%;justify-content:center">확인!</button></div>';document.body.appendChild(ov);playSound('levelup');}
function showBadges(){var ov=document.createElement('div');ov.className='levelup-overlay';ov.onclick=function(e){if(e.target===ov)ov.remove();};var grid=BADGES.map(function(b){var e=earnedBadges.indexOf(b.id)!==-1;return '<div class="badge-item'+(e?'':' locked')+'"><div class="badge-icon">'+b.icon+'</div><div class="badge-name">'+b.name+'</div></div>';}).join('');ov.innerHTML='<div class="levelup-card" style="max-width:380px"><div style="font-size:1.2rem;font-weight:900;margin-bottom:14px">🏅 뱃지 ('+earnedBadges.length+'/'+BADGES.length+')</div><div class="badges-grid" style="margin-bottom:18px">'+grid+'</div><button class="btn btn-secondary" onclick="this.closest(\'div.levelup-overlay\').remove()" style="width:100%;justify-content:center">닫기</button></div>';document.body.appendChild(ov);}
function toggleImportant(en){var i=words.findIndex(function(w){return w.en.toLowerCase()===en.toLowerCase();});if(i!==-1){words[i].important=!words[i].important;saveWords();showToast(words[i].important?'⭐ 중요!':'☆ 해제');return words[i].important;}return false;}
function closePopup(){var p=document.getElementById('resultPopup');if(p){p.style.animation='slideDown .2s ease';setTimeout(function(){if(p.parentNode)p.remove();},180);}}
function nextQuestion(){closePopup();quizIdx++;renderQuizQuestion();}
function showResultPopup(isCorrect,en,ko){
  var existing=document.getElementById('resultPopup');if(existing)existing.remove();
  var isLast=(quizIdx+1>=quizList.length&&pendingWrongWords.length===0);
  var bg=isCorrect?'#dcfce7':'#fee2e2';
  var brd=isCorrect?'#22c55e':'#ef4444';
  var tc=isCorrect?'#15803d':'#b91c1c';
  var icon=isCorrect?(combo>=3?'🔥 '+combo+'콤보!':'✅ 정답!'):'❌ 틀렸어~';
  var wi=words.findIndex(function(w){return w.en.toLowerCase()===en.toLowerCase();});
  var isImp=wi!==-1&&words[wi].important;
  var pop=document.createElement('div');
  pop.id='resultPopup';
  pop.setAttribute('style','position:fixed;bottom:0;left:0;right:0;z-index:300;background:'+bg+';border-top:4px solid '+brd+';padding:14px 16px 28px;box-shadow:0 -8px 32px rgba(0,0,0,.15);animation:slideUp .22s ease;');
  var wrongHtml=isCorrect?'':'<div style="font-size:1rem;font-weight:900;margin-top:4px;color:#b91c1c">'+en+' = '+ko+'</div>';
  var nextLabel=isLast?'🏆 결과 보기':'다음 →';
  var nextBg=isCorrect?'#22c55e':'#ef4444';
  pop.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
    '<div><div style="font-size:1.15rem;font-weight:900;color:'+tc+'">'+icon+'</div>'+wrongHtml+'</div>'+
    '<button id="impBtn" style="padding:8px 13px;border-radius:50px;font-weight:800;font-size:.78rem;cursor:pointer;border:1.5px solid '+(isImp?'#fde68a':'#e2e8ff')+';background:'+(isImp?'#fef3c7':'#fff')+';color:'+(isImp?'#d97706':'#aaa')+'">'+( isImp?'⭐ 중요':'☆ 중요')+'</button>'+
    '</div>'+
    '<button onclick="closePopup();nextQuestion()" style="width:100%;padding:16px;border-radius:14px;border:none;background:'+nextBg+';color:white;font-weight:900;font-size:1.15rem;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.12)">'+nextLabel+'</button>';
  var impBtn=pop.querySelector('#impBtn');
  impBtn.addEventListener('click',function(){var nowImp=toggleImportant(en);impBtn.textContent=nowImp?'⭐ 중요':'☆ 중요';impBtn.style.borderColor=nowImp?'#fde68a':'#e2e8ff';impBtn.style.background=nowImp?'#fef3c7':'#fff';impBtn.style.color=nowImp?'#d97706':'#aaa';});
  document.body.appendChild(pop);
}
function autoCheckTyping(){var input=document.getElementById('typingInput');if(!input||quizAnswered)return;var dir=document.getElementById('qDir').value;var mode=document.getElementById('qMode').value;var en=document.getElementById('qEn').value;var ko=document.getElementById('qKo').value;var val=input.value.trim().toLowerCase();var answer=(mode==='fill'||dir==='ko2en')?en:ko;if(val===answer.toLowerCase())setTimeout(function(){checkTyping();},80);}
function playSound(type){try{if(!window._AC){window._AC=new(window.AudioContext||window.webkitAudioContext)();}var ctx=window._AC;if(ctx.state==='suspended')ctx.resume();var o=ctx.createOscillator();var g=ctx.createGain();o.connect(g);g.connect(ctx.destination);if(type==='correct'){o.type='sine';o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(880,ctx.currentTime+0.12);g.gain.setValueAtTime(0.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);o.start();o.stop(ctx.currentTime+0.35);}else if(type==='wrong'){o.type='sawtooth';o.frequency.setValueAtTime(200,ctx.currentTime);o.frequency.linearRampToValueAtTime(100,ctx.currentTime+0.2);g.gain.setValueAtTime(0.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);o.start();o.stop(ctx.currentTime+0.25);}else if(type==='levelup'){[440,554,659,880].forEach(function(f,i){var o2=ctx.createOscillator();var g2=ctx.createGain();o2.connect(g2);g2.connect(ctx.destination);o2.frequency.setValueAtTime(f,ctx.currentTime+i*0.1);g2.gain.setValueAtTime(0.1,ctx.currentTime+i*0.1);g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.1+0.18);o2.start(ctx.currentTime+i*0.1);o2.stop(ctx.currentTime+i*0.1+0.18);});}}catch(e){}}
document.addEventListener('touchstart',function(){if(window._AC&&window._AC.state==='suspended')window._AC.resume();},{passive:true});
document.addEventListener('click',function(){if(window._AC&&window._AC.state==='suspended')window._AC.resume();});

</script>
<div class="cheer-pop" id="cheerPop"></div>
